spring.application.name=Ecart
spring.datasource.url=jdbc:h2:file:D:/Users/279004/MyDB/customerdb;AUTO_SERVER=true;

# Server
server.port=8080

# H2 Database
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#imge store
spring.web.resources.static-locations=file:/D:/Users/279004/MyDB/


# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=ecartSecretKey1234567890abcdefghijklmnopqrstuvwxyz
jwt.expiration=86400000

# Logging
logging.level.org.springframework=INFO
logging.level.com.ecart=DEBUG
